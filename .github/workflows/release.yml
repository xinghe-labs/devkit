name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Tauri 单形态发布（R6 改造）：
# - 产物来自 `pnpm build`（tauri build → NSIS；R7 起 build 即 tauri，不再有 build:tauri 别名与 electron-builder portable 包）；
# - 清单经 devkit-manifest 的 include_dir 编译期内嵌进 exe（决策 D10），manifest-check 在 Rust 门禁里跑；
# - latest.json 由 devkit-cli make-update-index 生成（协议与 TS 版一致，额外带 runtime: "tauri"）；
# - 冒烟对象换成打包出来的 devkit-app.exe（DEVKIT_SMOKE 看门狗，退出码判定）。
jobs:
  release:
    name: build / verify / publish
    runs-on: windows-latest

    # 把 secret 提到 env 再在 if 里判断：GitHub Actions 的 secrets 上下文
    # 在 step 级 if 里不可靠，用 env 是通行做法。
    # 只要 SIGNPATH_API_TOKEN 没配，下面所有签名步骤都会整段跳过，产物仍是未签名的，
    # 流水线不会因此变红。
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'devkit' }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
      SIGNPATH_ARTIFACT_CONFIG_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'nsis-installer' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（渲染端构建用；跳过 Electron 二进制）
        env:
          # release 走 Tauri 形态，不需要 electron.exe 本体，跳过 250MB 下载
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm install --frozen-lockfile

      # 发布前的门禁：任何一项不过都不允许出包。
      # 这里刻意重复跑一遍 CI 的内容 —— 打 tag 的人可能跳过过 PR 检查。
      - name: 清单校验（TS 侧 JSON Schema + 语义约束）
        run: pnpm manifest:check

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码规范
        run: pnpm lint

      - name: 单元测试（TS）
        run: pnpm test

      - name: 确保 Rust stable
        shell: pwsh
        run: rustup default stable

      - name: Rust 门禁（fmt / clippy / test）
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --workspace

      - name: 清单校验（Rust 侧，编译期内嵌前的权威检查）
        working-directory: src-tauri
        run: cargo run --release -p devkit-manifest --bin manifest-check

      - name: 读取版本号（以 tauri.conf.json 为准）
        id: version
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          "version=$($conf.version)" >> $env:GITHUB_OUTPUT
          Write-Host "版本：$($conf.version)"

      # tauri build：渲染端 beforeBuildCommand + cargo build --release + NSIS 打包。
      # webviewInstallMode=embedBootstrapper，安装包自带 WebView2 bootstrapper。
      - name: 构建并打包（Tauri + NSIS）
        run: pnpm build

      - name: 生成更新索引 latest.json
        working-directory: src-tauri
        run: cargo run --release -p devkit-cli --bin devkit-cli -- make-update-index --dir target/release/bundle/nsis --version ${{ steps.version.outputs.version }}

      - name: 记录安装包体积（目标 ≤ 15MB）
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "安装包：$($exe.Name) = ${mb} MiB"
          if ($mb -gt 15) { throw "安装包 ${mb} MiB 超过 15MB 目标" }

      - name: 校验产物确实存在
        shell: pwsh
        run: |
          if (-not (Test-Path 'src-tauri/target/release/bundle/nsis/latest.json')) { throw '缺少 latest.json' }
          Get-Content src-tauri/target/release/bundle/nsis/latest.json
          Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object Name, Length

      - name: 冒烟测试打包产物（渲染必须挂载且 signal_ready 到达）
        shell: pwsh
        run: |
          $env:DEVKIT_SMOKE = '1'
          $env:DEVKIT_SMOKE_DELAY_MS = '20000'
          $exe = Join-Path $PWD 'src-tauri/target/release/devkit-app.exe'
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }
          $process = Start-Process -FilePath $exe -WorkingDirectory $PWD -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "冒烟测试失败，退出码 $($process.ExitCode)" }
          Write-Host "冒烟测试通过"

      # ---------------- 代码签名（SignPath，未配置时整段跳过） ----------------
      # 为什么必须签：未签名的 exe 双击会被 SmartScreen 全屏拦截，而目标用户
      # 正是「刚装完系统、第一件事就是下载这个 exe」的人 —— 到这里就流失了。
      # 申请与配置步骤见 docs/CODE-SIGNING.md（含 Tauri 产物的 hash 提交步骤）。

      - name: 上传未签名产物（SignPath 需要先有 artifact）
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-installer
          path: src-tauri/target/release/bundle/nsis/devkit_*-setup.exe
          if-no-files-found: error

      - name: 提交 SignPath 签名请求
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: 用签名后的产物替换未签名的那份
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter 'devkit_*-setup.exe' | Select-Object -First 1
          if (-not $signed) { throw '签名输出目录里没有找到 setup.exe' }
          $target = Join-Path $PWD ('src-tauri/target/release/bundle/nsis/' + $signed.Name)
          Copy-Item $signed.FullName $target -Force
          Write-Host "已用签名后的产物替换：$target"

          # 签名后体积会变，更新索引里的 SHA-256 必须重算，否则更新检查会拿到对不上的哈希
          cargo run --release -p devkit-cli --bin devkit-cli -- make-update-index --dir src-tauri/target/release/bundle/nsis --version ${{ steps.version.outputs.version }}
        working-directory: src-tauri

      - name: 核对签名状态
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          # 用 .NET 直接读签名，不依赖 Get-AuthenticodeSignature
          # （实测有些机器的 PowerShell 缺 Microsoft.PowerShell.Security 模块）
          $exe = (Get-ChildItem src-tauri/target/release/bundle/nsis -Filter 'devkit_*-setup.exe' | Select-Object -First 1).FullName
          try {
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate]::CreateFromSignedFile($exe)
            Write-Host "签名者：$($cert.Subject)"
            Write-Host "有效期至：$($cert.GetExpirationDateString())"
          } catch {
            throw "产物仍未签名：$($_.Exception.Message)"
          }

      - name: 未配置签名（提示）
        if: env.SIGNPATH_API_TOKEN == ''
        run: |
          Write-Host "::warning::SIGNPATH_API_TOKEN 未配置，本次产物未签名。"
          Write-Host "未签名的 exe 会被 SmartScreen 拦截，详见 docs/CODE-SIGNING.md"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: true
          # body_path 会与自动生成的变更记录合并：先放"请先读这一段"，再是提交列表
          body_path: .github/release-notice.md
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/devkit_*-setup.exe
            src-tauri/target/release/bundle/nsis/latest.json
