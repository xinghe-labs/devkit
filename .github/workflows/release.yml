name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build / verify / publish
    runs-on: windows-latest

    # 把 secret 提到 env 再在 if 里判断：GitHub Actions 的 secrets 上下文
    # 在 step 级 if 里不可靠，用 env 是通行做法。
    # 只要 SIGNPATH_API_TOKEN 没配，下面所有签名步骤都会整段跳过，产物仍是未签名的，
    # 流水线不会因此变红。
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'devkit' }}
      SIGNPATH_POLICY_SLUG: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
      SIGNPATH_ARTIFACT_CONFIG_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG || 'nsis-installer' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（发布必须下载 Electron 运行时）
        run: pnpm install --frozen-lockfile

      # 发布前的门禁：任何一项不过都不允许出包。
      # 这里刻意重复跑一遍 CI 的内容 —— 打 tag 的人可能跳过过 PR 检查。
      - name: 清单校验
        run: pnpm manifest:check

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码规范
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

      - name: 确保 Electron 运行时存在
        shell: pwsh
        run: |
          # pnpm store 命中缓存时 electron 的 postinstall 不会真正执行（见 CI 里的说明）
          $exe = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          if (-not (Test-Path $exe)) {
            $env:ELECTRON_MIRROR = 'https://github.com/electron/electron/releases/download/'
            node node_modules/electron/install.js
          }
          if (-not (Test-Path $exe)) { throw "Electron 运行时缺失：$exe" }

      - name: 构建并打包（NSIS + portable）
        # --publish never：package.json 里有 repository 字段时，electron-builder 会
        # 推断"要自动发布"并要求 GH_TOKEN。发布交给下面的 action-gh-release 做。
        run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 生成更新索引 latest.json
        run: pnpm release:index

      - name: 校验产物确实存在
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/latest.json')) { throw '缺少 latest.json' }
          Get-Content release/latest.json
          Get-ChildItem release -Filter '*.exe' | Select-Object Name, Length

      - name: 冒烟测试打包产物（界面必须能渲染且无渲染进程报错）
        shell: pwsh
        run: |
          $env:DEVKIT_SMOKE = '1'
          $env:DEVKIT_SMOKE_DELAY_MS = '20000'
          $exe = Join-Path $PWD 'release/win-unpacked/devkit.exe'
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }
          $process = Start-Process -FilePath $exe -WorkingDirectory $PWD -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "冒烟测试失败，退出码 $($process.ExitCode)" }
          Write-Host "冒烟测试通过"

      # ---------------- 代码签名（SignPath，未配置时整段跳过） ----------------
      # 为什么必须签：未签名的 exe 双击会被 SmartScreen 全屏拦截，而目标用户
      # 正是「刚装完系统、第一件事就是下载这个 exe」的人 —— 到这里就流失了。
      # 申请与配置步骤见 docs/CODE-SIGNING.md。

      - name: 上传未签名产物（SignPath 需要先有 artifact）
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-installer
          path: release/devkit-*-setup.exe
          if-no-files-found: error

      - name: 提交 SignPath 签名请求
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: 用签名后的产物替换未签名的那份
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter 'devkit-*-setup.exe' | Select-Object -First 1
          if (-not $signed) { throw '签名输出目录里没有找到 setup.exe' }
          $target = Join-Path $PWD ('release/' + $signed.Name)
          Copy-Item $signed.FullName $target -Force
          Write-Host "已用签名后的产物替换：$target"

          # 签名后体积会变，更新索引里的 SHA-256 必须重算，否则更新检查会拿到对不上的哈希
          pnpm release:index

      - name: 核对签名状态
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          # 用 .NET 直接读签名，不依赖 Get-AuthenticodeSignature
          # （实测有些机器的 PowerShell 缺 Microsoft.PowerShell.Security 模块）
          $exe = (Get-ChildItem release -Filter 'devkit-*-setup.exe' | Select-Object -First 1).FullName
          try {
            $cert = [System.Security.Cryptography.X509Certificates.X509Certificate]::CreateFromSignedFile($exe)
            Write-Host "签名者：$($cert.Subject)"
            Write-Host "有效期至：$($cert.GetExpirationDateString())"
          } catch {
            throw "产物仍未签名：$($_.Exception.Message)"
          }

      - name: 未配置签名（提示）
        if: env.SIGNPATH_API_TOKEN == ''
        run: |
          Write-Host "::warning::SIGNPATH_API_TOKEN 未配置，本次产物未签名。"
          Write-Host "未签名的 exe 会被 SmartScreen 拦截，详见 docs/CODE-SIGNING.md"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b
        with:
          draft: true
          # body_path 会与自动生成的变更记录合并：先放"请先读这一段"，再是提交列表
          body_path: .github/release-notice.md
          generate_release_notes: true
          files: |
            release/devkit-*-setup.exe
            release/devkit-*-portable.exe
            release/latest.json
