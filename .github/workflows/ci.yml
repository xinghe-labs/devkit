name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint / typecheck / manifest / test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        env:
          # 校验任务不需要 Electron 运行时二进制（约 250MB），跳过下载以加速 CI。
          # 需要跑界面冒烟的是下面的 smoke 任务，它必须下载。
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 清单校验（JSON Schema + 语义约束）
        run: pnpm manifest:check

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码规范
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

  smoke:
    name: 界面冒烟（渲染进程不得报错）
    runs-on: windows-latest
    needs: check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（需要 Electron 运行时）
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      # pnpm 的 store 命中缓存时（reused N / downloaded 0），electron 的 postinstall
      # 不会真正执行，node_modules/electron/dist 会是空的 —— 实测就是这个原因让冒烟任务红掉。
      # 所以这里不依赖 postinstall，显式确保二进制存在。
      - name: 确保 Electron 运行时存在
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          if (-not (Test-Path $exe)) {
            Write-Host "electron 二进制缺失，手动触发下载（用官方源，CI runner 在海外）"
            $env:ELECTRON_MIRROR = 'https://github.com/electron/electron/releases/download/'
            node node_modules/electron/install.js
          }
          if (-not (Test-Path $exe)) {
            Get-ChildItem node_modules/electron -Recurse -Depth 1 | Select-Object FullName
            throw "Electron 运行时仍然缺失：$exe"
          }
          Write-Host "electron.exe 就绪：$exe"

      - name: 启动应用并断言界面无报错
        shell: pwsh
        run: |
          # DEVKIT_SMOKE 下：渲染进程只要报过 error，退出码就是 1。
          # 这样"界面白屏"不会再被当成启动成功。
          $env:DEVKIT_SMOKE = '1'
          $env:DEVKIT_SMOKE_DELAY_MS = '20000'
          $exe = Join-Path $PWD 'node_modules/electron/dist/electron.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '.' -WorkingDirectory $PWD -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "冒烟测试失败，退出码 $($process.ExitCode)" }
          Write-Host "冒烟测试通过"

      - name: 上传日志（失败时排查用）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devkit-logs
          path: ~/AppData/Roaming/devkit/logs
          if-no-files-found: ignore
