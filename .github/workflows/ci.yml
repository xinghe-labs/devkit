name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tauri 单形态（R7 切换后）：不再有 Electron 运行时、electron-builder 与 portable 包。
jobs:
  check:
    name: lint / typecheck / test（TS 侧）
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（渲染端构建/测试用）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码规范
        run: pnpm lint

      - name: 单元测试
        run: pnpm test

  rust:
    name: rust（fmt / clippy / test / manifest-check）
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # windows-latest 镜像自带 rustup，锁定 stable 保证与本地一致
      - name: 确保 Rust stable
        shell: pwsh
        run: rustup default stable

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace

      # 清单校验的权威实现（编译期内嵌 manifest 的同一套解析器，决策 D10）
      - name: 清单校验（Rust 侧）
        working-directory: src-tauri
        run: cargo run --release -p devkit-manifest --bin manifest-check

  smoke:
    name: 界面冒烟（渲染挂载 + IPC 回执）
    runs-on: windows-latest
    needs: [check, rust]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm

      # 冒烟只跑 devkit-app.exe，不打 NSIS 安装包
      - name: 确保 Rust stable
        shell: pwsh
        run: rustup default stable

      - name: 安装依赖（vite 构建用）
        run: pnpm install --frozen-lockfile

      - name: 构建（vite + cargo，不打包）
        run: pnpm build --no-bundle

      - name: 启动应用并断言渲染挂载（DEVKIT_SMOKE）
        shell: pwsh
        run: |
          # DEVKIT_SMOKE 下：60s 内渲染层 signal_ready IPC 回执到达即退出码 0，
          # 否则 1（渲染没挂起来）。Tauri 拿不到渲染进程 console 错误流，
          # 视觉核对依赖真机手工清单（决策 D13）。
          $env:DEVKIT_SMOKE = '1'
          $env:DEVKIT_SMOKE_DELAY_MS = '20000'
          $exe = Join-Path $PWD 'src-tauri/target/release/devkit-app.exe'
          if (-not (Test-Path $exe)) { throw "找不到 $exe" }
          $process = Start-Process -FilePath $exe -WorkingDirectory $PWD -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "冒烟测试失败，退出码 $($process.ExitCode)"
          }
          Write-Host "冒烟测试通过"

      - name: 上传日志（失败时排查用）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: devkit-logs
          path: ~/AppData/Roaming/devkit/logs
          if-no-files-found: ignore
