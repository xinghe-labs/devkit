<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP 说明：
      - style-src 需要 unsafe-inline，因为 antd 走 CSS-in-JS 在运行时注入 <style>
      - connect-src 允许 ws://localhost:* 供 vite 开发期 HMR 使用
      - 不引入任何远程脚本/样式，全部本地资源
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>devkit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
