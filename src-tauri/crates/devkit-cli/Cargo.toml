[package]
name = "devkit-cli"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "devkit 维护 CLI：manifest-check / install / detect-report / make-update-index / verify-update（镜像 scripts/*.ts）"

[dependencies]
devkit-types = { path = "../devkit-types" }
devkit-core = { path = "../devkit-core" }
devkit-manifest = { path = "../devkit-manifest" }
devkit-sys = { path = "../devkit-sys" }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
futures.workspace = true
tokio = { workspace = true }
tokio-util = { workspace = true }

[[bin]]
name = "devkit-cli"
path = "src/main.rs"
