# electron-builder 配置
# 说明：这里**刻意不配 publish**。
#  · package.json 里已经有 repository 字段，electron-builder 会据此推断「要自动发布」并要求 GH_TOKEN；
#    所以 npm script 里的 dist 显式带了 --publish never（实测踩到过：打包成功却因为缺 token 报错）。
#  · 更新走的是提示式方案（core/updater）：从用户配置的更新源拉 latest.json / latest.yml，
#    比较版本后把下载地址交给用户 —— 不依赖构建期的 publish 地址，也不静默替换二进制。
#  · 发布产物由 .github/workflows/release.yml 用 action-gh-release 上传。

appId: io.github.devkit
productName: devkit
copyright: Copyright © 2026 devkit contributors

directories:
  buildResources: build
  output: release

# 只打包构建产物，不把源码、清单源文件、node_modules 塞进去
files:
  - out/**
  - package.json

# 清单走 extraResources，运行时从 process.resourcesPath/manifest 读取，
# 这样热更新与用户手工替换清单都不需要重新打包 asar
extraResources:
  - from: resources/manifest
    to: manifest
    filter:
      - '**/*'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # 产物名刻意不含空格：带空格的 URL 会被各种工具链改写
  # （实测 GitHub Release 上传后变成 `devkit.Setup.0.1.0.exe`，而 latest.json 里
  #   写的是 `devkit Setup 0.1.0.exe` —— 更新检查会指向一个不存在的文件名）。
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: devkit
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-portable.${ext}
